<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="800" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="2"/>

  <!-- title bar -->
  <rect x="0" y="0" width="1280" height="40" fill="#EDEDED" stroke="#CCCCCC"/>
  <circle cx="20" cy="20" r="6" fill="#CCCCCC"/>
  <circle cx="42" cy="20" r="6" fill="#CCCCCC"/>
  <circle cx="64" cy="20" r="6" fill="#CCCCCC"/>
  <text x="640.0" y="25" font-size="13" fill="#666666" text-anchor="middle">Z-CashFlow — Nova movimentacao</text>

  <!-- sidebar -->
  <rect x="0" y="40" width="220" height="760" fill="#FAFAFA" stroke="#DDDDDD"/>
  <rect x="24" y="56" width="140" height="20" fill="#999999"/>
  
        <rect x="0" y="96" width="220" height="48" fill="none"/>
        <rect x="24" y="112" width="16" height="16" fill="#AAAAAA"/>
        <rect x="52" y="114" width="120" height="12" fill="#AAAAAA"/>
        
        <rect x="0" y="152" width="220" height="48" fill="#D9D9D9"/>
        <rect x="24" y="168" width="16" height="16" fill="#AAAAAA"/>
        <rect x="52" y="170" width="120" height="12" fill="#666666"/>
        
        <rect x="0" y="208" width="220" height="48" fill="none"/>
        <rect x="24" y="224" width="16" height="16" fill="#AAAAAA"/>
        <rect x="52" y="226" width="120" height="12" fill="#AAAAAA"/>
        
        <rect x="0" y="264" width="220" height="48" fill="none"/>
        <rect x="24" y="280" width="16" height="16" fill="#AAAAAA"/>
        <rect x="52" y="282" width="120" height="12" fill="#AAAAAA"/>
        
        <rect x="0" y="320" width="220" height="48" fill="none"/>
        <rect x="24" y="336" width="16" height="16" fill="#AAAAAA"/>
        <rect x="52" y="338" width="120" height="12" fill="#AAAAAA"/>
        

  <!-- topbar -->
  <rect x="220" y="40" width="1060" height="56" fill="#FFFFFF" stroke="#EEEEEE"/>
  <circle cx="1224" cy="68" r="18" fill="#DDDDDD"/>
  <rect x="1120" y="60" width="80" height="14" fill="#BBBBBB"/>

  <!-- content -->
  <g transform="translate(220,96)">
    
  <text x="0" y="30" font-size="20" fill="#444444">Nova movimentacao</text>
  <text x="0" y="52" font-size="12" fill="#999999">RF001 - cadastro de entradas e saidas</text>

  <rect x="0" y="76" width="640" height="480" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1.5" />
  <g transform="translate(30,110)">
    <text x="0" y="0" font-size="12" fill="#777777">Tipo</text>
    <rect x="0" y="8" width="160" height="40" fill="#D9D9D9" stroke="#999999" stroke-width="1.5"/>
    <text x="80.0" y="33.0" font-size="12" fill="#555555" text-anchor="middle">( ) Entrada</text>
    <rect x="180" y="8" width="160" height="40" fill="#D9D9D9" stroke="#999999" stroke-width="1.5"/>
    <text x="260.0" y="33.0" font-size="12" fill="#555555" text-anchor="middle">( ) Saida</text>

    <text x="0" y="80" font-size="11" fill="#888888">Valor (R$)</text>
    <rect x="0" y="88" width="340" height="32" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
    <text x="0" y="150" font-size="11" fill="#888888">Data</text>
    <rect x="0" y="158" width="340" height="32" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
    <text x="0" y="220" font-size="11" fill="#888888">Categoria (lista suspensa)</text>
    <rect x="0" y="228" width="580" height="32" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>
    <text x="0" y="290" font-size="11" fill="#888888">Descricao</text>
    <rect x="0" y="298" width="580" height="32" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1.5"/>

    <rect x="0" y="370" width="160" height="44" fill="#D9D9D9" stroke="#999999" stroke-width="1.5"/>
    <text x="80.0" y="397.0" font-size="12" fill="#555555" text-anchor="middle">Salvar</text>
    <rect x="180" y="370" width="160" height="44" fill="#FFFFFF" stroke="#999999" stroke-width="1.5"/>
    <text x="260.0" y="397.0" font-size="12" fill="#555555" text-anchor="middle">Cancelar</text>
  </g>

  <rect x="680" y="76" width="280" height="480" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1.5" /><text x="690" y="98" font-size="12" fill="#999999">Dica / validacao</text>
  <text x="700" y="120" font-size="11" fill="#999999">- Campos obrigatorios</text>
  <text x="700" y="140" font-size="11" fill="#999999">- Formato de data</text>
  <text x="700" y="160" font-size="11" fill="#999999">  dd/mm/aaaa</text>
  <text x="700" y="180" font-size="11" fill="#999999">- Categoria compativel</text>
  <text x="700" y="200" font-size="11" fill="#999999">  com o tipo escolhido</text>

  </g>
